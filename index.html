<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23d88020'/%3E%3Crect y='6' width='16' height='4' fill='%23000'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23e83828'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#07070f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}

#touch.on{display:block}
#dpad{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.3);box-sizing:border-box}
#dpad .arm{position:absolute;background:rgba(255,200,80,.35);border:2px solid rgba(255,255,255,.4);box-sizing:border-box;border-radius:6px}
#dpad .arm.on{background:rgba(255,200,80,.8)}
#pump{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(232,56,40,.45);border:4px solid rgba(255,255,255,.5);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:bold 20px "Courier New",monospace;color:#fff;text-shadow:0 0 4px #000}
#pump.down{background:rgba(232,56,40,.85);transform:scale(.94)}

<body>
<canvas id="game" width="480" height="600"></canvas>
<div id="touch"><div id="dpad"><div class="arm" id="aU"></div><div class="arm" id="aD"></div><div class="arm" id="aL"></div><div class="arm" id="aR"></div></div><div id="pump">PUMP</div></div>
<div id="mini"><div id="bPause">II</div><div id="bMute">♪</div><div id="bFs">[ ]</div></div>
<script>
/* BURROW BUSTER — an original dig-and-pump arcade game. Single file, no assets. */
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const T=32,COLS=14,ROWS=17,HUDH=40,FW=COLS*T,FH=HUDH+ROWS*T;
let VW=FW,VH=FH,FX=0,FY=0,K=1,S=1;
let seed=Date.now()>>>0; function rand(){seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
const rnd=(a,b)=>a+rand()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},REV={u:'d',d:'u',l:'r',r:'l'};
const HI_KEY='burrowBusterHi';let hiScore=+(localStorage.getItem(HI_KEY)||0);

/* ---------- AUDIO ---------- */
const Audio={ac:null,master:null,noiseBuf:null,muted:localStorage.getItem('burrowBusterMute')==='1',
 init(){ if(!this.ac){try{const AC=window.AudioContext||window.webkitAudioContext;this.ac=new AC();this.master=this.ac.createGain();this.master.gain.value=this.muted?0:0.5;this.master.connect(this.ac.destination);
   const n=this.ac.sampleRate*0.5,b=this.ac.createBuffer(1,n,this.ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.noiseBuf=b;}catch(e){return;}}
   if(this.ac.state!=='running'){const p=this.ac.resume();if(p&&p.catch)p.catch(()=>{});} },
 toggle(){this.muted=!this.muted;localStorage.setItem('burrowBusterMute',this.muted?'1':'0');if(this.master)this.master.gain.value=this.muted?0:0.5;updMute();},
 ok(){return this.ac&&!this.muted&&this.ac.state==='running';},
 tone(type,f0,f1,dur,vol,delay){if(!this.ok())return;const t=this.ac.currentTime+(delay||0),o=this.ac.createOscillator(),g=this.ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.02);},
 noise(dur,vol,fc,delay){if(!this.ok())return;const t=this.ac.currentTime+(delay||0),s=this.ac.createBufferSource(),f=this.ac.createBiquadFilter(),g=this.ac.createGain();s.buffer=this.noiseBuf;f.type='lowpass';f.frequency.value=fc||2000;g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+dur+0.02);}
};
const N=s=>440*Math.pow(2,s/12);
const Sfx={shoot(){Audio.tone('square',300,900,0.08,0.08);},pump(i){Audio.tone('square',200+i*120,320+i*160,0.09,0.12);},
 pop(){Audio.noise(0.25,0.3,3000);Audio.tone('square',900,120,0.2,0.12);},charge(){Audio.tone('sawtooth',90,180,0.6,0.06);},
 fire(){Audio.noise(0.6,0.22,900);},rock(){Audio.noise(0.5,0.35,400);Audio.tone('triangle',120,50,0.4,0.2);},
 crush(){Audio.noise(0.3,0.4,1500);},die(){for(let i=0;i<6;i++)Audio.tone('square',N(12-i*3),N(10-i*3),0.14,0.1,i*0.13);},
 veg(){[0,4,7,12].forEach((s,i)=>Audio.tone('square',N(s+12),N(s+12),0.08,0.1,i*0.07));},extra(){[0,7,12,7,12,19].forEach((s,i)=>Audio.tone('square',N(s+5),N(s+5),0.09,0.1,i*0.08));},
 clear(){[0,4,7,12,7,12,16,19].forEach((s,i)=>Audio.tone('square',N(s),N(s),0.12,0.1,i*0.11));},
 start(){[0,0,7,7,9,9,7,-99,5,5,4,4,2,2,0].forEach((s,i)=>s>-99&&Audio.tone('square',N(s),N(s),0.1,0.08,i*0.1));}};
// chiptune loop: plays only while the digger walks (classic arcade feel)
const MEL=[0,-99,3,5,7,-99,5,3,2,-99,5,7,8,7,5,2,0,3,7,12,10,7,3,5,7,5,3,2,0,-99,-5,-99];
const BAS=[-24,-24,-17,-17,-22,-22,-19,-19];
const Music={step:0,tick(){const s=this.step++%32;const m=MEL[s];if(m>-99)Audio.tone('square',N(m),N(m),0.11,0.06);if(s%4===0)Audio.tone('triangle',N(BAS[(s>>2)%8]),N(BAS[(s>>2)%8]),0.22,0.12);if(s%2===1)Audio.noise(0.03,0.04,6000);}};
// robust mobile audio unlock
const SILENT_WAV='data:audio/wav;base64,UklGRiwAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQgAAAAAAAAAAAAAAA==';
let silentEl=null;const UNLOCK_EVS=['touchend','pointerup','pointerdown','mousedown','click','keydown'];
function audioUnlock(){try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
 if(!silentEl){try{silentEl=document.createElement('audio');silentEl.src=SILENT_WAV;silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.volume=0.01;}catch(e){}}
 if(silentEl&&silentEl.paused){const p=silentEl.play();if(p&&p.catch)p.catch(()=>{});}
 Audio.init();if(Audio.ac&&Audio.ac.state==='running'&&silentEl&&!silentEl.paused)for(const ev of UNLOCK_EVS)removeEventListener(ev,audioUnlock,true);}
for(const ev of UNLOCK_EVS)addEventListener(ev,audioUnlock,true);addEventListener('touchstart',audioUnlock,true);

/* ---------- INPUT ---------- */
const In={keys:[],tdir:null,pump:false,pumpP:false,startP:false,pauseP:false};
const KEYD={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{const d=KEYD[e.code];if(d){if(!In.keys.includes(d))In.keys.push(d);e.preventDefault();}
 if(e.code==='Space'||e.code==='KeyZ'){if(!e.repeat){In.pumpP=true;In.startP=true;}In.pump=true;e.preventDefault();}
 if(e.code==='Enter'&&!e.repeat)In.startP=true;
 if((e.code==='KeyP'||e.code==='Escape')&&!e.repeat)In.pauseP=true;
 if(e.code==='KeyM'&&!e.repeat)Audio.toggle();if(e.code==='KeyF'&&!e.repeat)toggleFs();});
addEventListener('keyup',e=>{const d=KEYD[e.code];if(d)In.keys=In.keys.filter(k=>k!==d);if(e.code==='Space'||e.code==='KeyZ')In.pump=false;});
addEventListener('blur',()=>{In.keys=[];In.pump=false;In.tdir=null;if(G.mode==='play')G.mode='pause';});
function wantDir(){return In.tdir||(In.keys.length?In.keys[In.keys.length-1]:null);}
const touchEl=document.getElementById('touch'),dpad=document.getElementById('dpad'),pumpEl=document.getElementById('pump');
function enableTouch(){if(!document.body.classList.contains('touch')){document.body.classList.add('touch');touchEl.classList.add('on');resize();}}
let dpadId=null;
function dpadSet(t){const r=dpad.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
 In.tdir=Math.hypot(dx,dy)<r.width*0.12?null:(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));
 for(const k of 'UDLR')document.getElementById('a'+k).classList.toggle('on',In.tdir===k.toLowerCase());}
dpad.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();const t=e.changedTouches[0];dpadId=t.identifier;dpadSet(t);if(G.mode!=='play'&&G.mode!=='pause')In.startP=true;},{passive:false});
dpad.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===dpadId)dpadSet(t);},{passive:false});
const dEnd=e=>{for(const t of e.changedTouches)if(t.identifier===dpadId){dpadId=null;In.tdir=null;for(const k of 'UDLR')document.getElementById('a'+k).classList.remove('on');}};
dpad.addEventListener('touchend',dEnd);dpad.addEventListener('touchcancel',dEnd);
pumpEl.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();pumpEl.classList.add('down');In.pump=true;In.pumpP=true;In.startP=true;},{passive:false});
const pEnd=e=>{e.preventDefault();pumpEl.classList.remove('down');In.pump=false;};
pumpEl.addEventListener('touchend',pEnd,{passive:false});pumpEl.addEventListener('touchcancel',pEnd,{passive:false});
document.addEventListener('touchstart',e=>{enableTouch();if(G.mode!=='play'&&G.mode!=='pause')In.startP=true;},{passive:true});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
cv.addEventListener('mousedown',()=>{if(G.mode!=='play')In.startP=true;});
function miniBtn(id,f){const el=document.getElementById(id);el.addEventListener('click',e=>{e.stopPropagation();f();});el.addEventListener('touchstart',e=>{e.stopPropagation();},{passive:true});}
miniBtn('bPause',()=>{In.pauseP=true;});miniBtn('bMute',()=>Audio.toggle());miniBtn('bFs',()=>toggleFs());
function updMute(){document.getElementById('bMute').textContent=Audio.muted?'OFF':'♪ ON';}updMute();
function toggleFs(){const d=document,el=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);
 else{const r=el.requestFullscreen||el.webkitRequestFullscreen;if(r){const p=r.call(el,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{});}}}catch(e){}}
let fsTried=false;document.addEventListener('touchend',()=>{if(!fsTried){fsTried=true;if(!(document.fullscreenElement||document.webkitFullscreenElement))toggleFs();}});
document.addEventListener('fullscreenchange',resize);

/* ---------- LAYOUT: adaptive full-window view, field never covered by controls ---------- */
function place(el,x,y,w,h){el.style.left=x+'px';el.style.top=y+'px';if(w!=null){el.style.width=w+'px';el.style.height=h+'px';}}
function resize(){
 const vw=innerWidth,vh=innerHeight,touch=document.body.classList.contains('touch'),port=vh>vw*1.05;
 let s=port?Math.min(vw/(FW+16),(touch?vh*0.6:vh)/(FH+12)):Math.min(vh/(FH+12),(touch?(vw-2*170):vw-120)/FW);
 s=Math.max(s,0.25);S=s;VW=vw/s;VH=vh/s;FX=Math.round((VW-FW)/2);FY=port&&touch?6:Math.round((VH-FH)/2);
 const dpr=Math.min(devicePixelRatio||1,2),bw=Math.min(Math.round(vw*dpr),2400);K=bw/VW;
 cv.width=bw;cv.height=Math.round(VH*K);cv.style.width=vw+'px';cv.style.height=vh+'px';
 const fx=FX*s,fy=FY*s,fw=FW*s,fh=FH*s,mini=document.getElementById('mini');
 let D,P,dc,pc;
 if(port){const y0=fy+fh+4,h=vh-y0;D=Math.min(170,h*0.72,vw*0.44);P=Math.min(130,h*0.55,vw*0.32);dc=[vw*0.27,y0+h*0.6];pc=[vw*0.77,y0+h*0.6];
  place(mini,vw/2-75,y0+2);}
 else{const L=fx,R=vw-fx-fw;D=Math.min(170,L*0.86,vh*0.5);P=Math.min(130,R*0.7,vh*0.36);dc=[L/2,vh*0.62];pc=[fx+fw+R/2,vh*0.64];
  place(mini,R>=152?fx+fw+R/2-75:vw-152,8);}
 place(dpad,dc[0]-D/2,dc[1]-D/2,D,D);place(pumpEl,pc[0]-P/2,pc[1]-P/2,P,P);
 const a=D*0.3;place(document.getElementById('aU'),D/2-a/2-3,6,a,a);place(document.getElementById('aD'),D/2-a/2-3,D-a-12,a,a);
 place(document.getElementById('aL'),6,D/2-a/2-3,a,a);place(document.getElementById('aR'),D-a-12,D/2-a/2-3,a,a);
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));if(window.visualViewport)visualViewport.addEventListener('resize',resize);

/* ---------- SPRITES (original pixel art drawn in code) ---------- */
const PAL={B:'#2a6cff',b:'#123a9c',W:'#f4f4f4',S:'#ffc090',K:'#111',H:'#9aa',R:'#e83828',r:'#a01810',Y:'#ffe040',G:'#38c048',D:'#1c7a2c',L:'#b8f070',O:'#ff9020',P:'#ff70c0'};
function spr(rows){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');rows.forEach((row,j)=>{for(let i=0;i<16;i++){const ch=row[i];if(ch&&ch!=='.'){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1);}}});return c;}
const DIG_TOP=["................","....bBBBBb......","...bBBBBBBBb....","...BBWWWWWBB....","...BWSSSKSWB....","...BWSSSSSSB....","....WWSSSSW.....","....WWWWWWWW....","...WWBWWWWWWHHH.","...WWBWWWWWWHH..","...WWBWWWWWW....","....WWWWWWW....."];
const SPR={
 dig1:spr(DIG_TOP.concat(["....WW..WW......","....WW..WW......","...bBB..bBB.....","................"])),
 dig2:spr(DIG_TOP.concat(["....WWWWW.......",".....WWW.WW.....","....bBB...bBB...","................"])),
 pk1:spr(["................",".....RRRRRR.....","...RRRRRRRRRR...","..RRRRRRRRRRRR..","..RYYYYRRYYYYR..",".RYWWKYRYWWKYRR.",".RYWWKYRYWWKYRR.",".RRYYYYRRYYYYRR.",".RRRRRRRRRRRRRR.",".RRRRRRRRRRRRRr.","..RRRRRRRRRRRr..","..rRRRRRRRRRrr..","...rrRRRRRRrr...","....WW....WW....","...WWW....WWW...","................"]),
 pk2:spr(["................",".....RRRRRR.....","...RRRRRRRRRR...","..RRRRRRRRRRRR..","..RYYYYRRYYYYR..",".RYWKWYRYWKWYRR.",".RYWKWYRYWKWYRR.",".RRYYYYRRYYYYRR.",".RRRRRRRRRRRRRR.",".RRRRRRRRRRRRRr.","..RRRRRRRRRRRr..","..rRRRRRRRRRrr..","...rrRRRRRRrr...",".....WW..WW.....","....WWW..WWW....","................"]),
 fy1:spr(["................",".........GGGG...","........GGGGGG..","...L....GGWKGG..","..LLL..GGGWKGGG.",".LLLLGGGGGGGGGGG",".LLGGGGGGGGGGRR.","..GGGYYYYGGGG...",".GGGYYYYYYGG....",".GGGYYYYYYGD....","GGD.GYYYYGD.....","GD..GGGGGGD.....","D....GG..GG.....",".....GG..GG.....","....YYY..YYY....","................"]),
 fy2:spr(["................",".........GGGG...","........GGGGGG..","........GGWKGG..","..L....GGGWKGGG.",".LLLLGGGGGGGGGGG","LLLGGGGGGGGGGRR.","..GGGYYYYGGGG...",".GGGYYYYYYGG....",".GGGYYYYYYGD....",".GGDGYYYYGD.....","..GDGGGGGGD.....","...D.GGGGG......","....GG...GG.....","...YYY...YYY....","................"]),
};
// dirt layer (tunnels are carved out of it)
const dirtCv=document.createElement('canvas');dirtCv.width=FW;dirtCv.height=ROWS*T;const dctx=dirtCv.getContext('2d');
const STRATA=[['#f0b838','#c88a20','#ffd870'],['#d88020','#a85a10','#f0a050'],['#b84c20','#7e2c10','#d8703a'],['#7c2c14','#4c1608','#a04a2a']];
function layerOf(r){return r<6?0:r<10?1:r<13?2:3;}
function paintDirt(){dctx.clearRect(0,0,FW,ROWS*T);let s=1234;const pr=()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff);
 for(let r=2;r<ROWS;r++){const c=STRATA[layerOf(r)];dctx.fillStyle=c[0];dctx.fillRect(0,r*T,FW,T);
  for(let i=0;i<70;i++){dctx.fillStyle=pr()<0.6?c[1]:c[2];const x=Math.floor(pr()*FW/2)*2,y=r*T+Math.floor(pr()*T/2)*2;dctx.fillRect(x,y,2,2);}}
 for(const b of [6,10,13]){dctx.fillStyle=STRATA[layerOf(b)][1];for(let x=0;x<FW;x+=4)dctx.fillRect(x,b*T+((x>>2)%3===0?-2:0),4,2);}}

/* ---------- GAME STATE ---------- */
const G={mode:'title',modeT:0,score:0,lives:3,round:1,nextExtra:10000,frame:0,enemies:[],rocks:[],fx:[],veg:null,harp:null,god:false,player:null,dug:[],hE:[],vE:[],rocksFallen:0,vegDone:false,espd:1};
const grid=()=>Array.from({length:ROWS},()=>new Array(COLS).fill(false));
function carveRect(x,y,w,h){dctx.clearRect(x,y,w,h);}
function digTile(c,r){if(r<0||r>=ROWS||c<0||c>=COLS)return;G.dug[r][c]=true;carveRect(c*T+2,r*T+2,T-4,T-4);}
function openEdge(c,r,d){const[dx,dy]=DIRS[d],c2=c+dx,r2=r+dy;if(c2<0||c2>=COLS||r2<1||r2>=ROWS)return;digTile(c,r);digTile(c2,r2);
 if(dx){const cc=Math.min(c,c2);G.hE[r][cc]=true;carveRect(cc*T+T-4,r*T+2,8,T-4);}else{const rr=Math.min(r,r2);G.vE[rr][c]=true;carveRect(c*T+2,rr*T+T-4,T-4,8);}}
function edgeOpen(c,r,d){const[dx,dy]=DIRS[d],c2=c+dx,r2=r+dy;if(c2<0||c2>=COLS||r2<1||r2>=ROWS)return false;return dx?G.hE[r][Math.min(c,c2)]:G.vE[Math.min(r,r2)][c];}
function rockAt(c,r){return G.rocks.some(k=>(k.st==='still'||k.st==='wobble')&&k.c===c&&Math.round(k.y/T)===r);}
function canGo(c,r,d){const[dx,dy]=DIRS[d];return edgeOpen(c,r,d)&&!rockAt(c+dx,r+dy);}
function aligned(o){return o.x%T===0&&o.y%T===0;}
function stepToward(o,d,spd){const[dx,dy]=DIRS[d];if(dx){const g=dx>0?Math.floor(o.x/T+1e-9)*T+T:Math.ceil(o.x/T-1e-9)*T-T;o.x=dx>0?Math.min(o.x+spd,g):Math.max(o.x-spd,g);}
 else{const g=dy>0?Math.floor(o.y/T+1e-9)*T+T:Math.ceil(o.y/T-1e-9)*T-T;o.y=dy>0?Math.min(o.y+spd,g):Math.max(o.y-spd,g);}}
function baseLevel(){G.dug=grid();G.hE=grid();G.vE=grid();paintDirt();G.rocks=[];G.enemies=[];G.fx=[];G.veg=null;G.harp=null;G.rocksFallen=0;G.vegDone=false;
 for(let c=0;c<COLS;c++){G.dug[1][c]=true;G.dug[0][c]=true;if(c<COLS-1)G.hE[1][c]=true;}
 G.espd=Math.min(0.85+0.07*(G.round-1),1.7);}
function mkEnemy(type,c,r,dir){return{type,x:c*T,y:r*T,sx:c*T,sy:r*T,dir:dir||'r',face:'r',st:'walk',inf:0,defT:0,ghostCD:ghostCD(),gT:0,fireCD:ri(200,400),fT:0,flame:0,flee:false,t:0,gone:false};}
function ghostCD(){return ri(420,840)/(1+0.12*(G.round-1));}
function mkRock(c,r){return{c,x:c*T,y:r*T,st:'still',t:0,crushed:[],gone:false};}
function newLevel(){baseLevel();
 for(let r=2;r<=8;r++)openEdge(6,r-1,'d');
 G.player={x:6*T,y:8*T,sx:6*T,sy:8*T,dir:'r',moving:false,digging:false,anim:0};
 const n=Math.min(3+G.round,9),nf=Math.min(1+Math.floor(G.round/2),n-1);
 const used=(c,r)=>c<0||c>=COLS||r<3||r>=ROWS||G.dug[r][c]||G.dug[r-1][c]||(r+1<ROWS&&G.dug[r+1][c]);
 for(let i=0;i<n;i++){for(let tries=0;tries<200;tries++){const hz=rand()<0.6,len=ri(3,4),c=ri(0,hz?COLS-len:COLS-1),r=ri(3,hz?ROWS-1:ROWS-len);
   const cells=[];for(let k=0;k<len;k++)cells.push(hz?[c+k,r]:[c,r+k]);
   if(cells.some(([a,b])=>used(a,b)||(Math.abs(a-6)+Math.abs(b-8))<5))continue;
   for(let k=0;k<len-1;k++)openEdge(cells[k][0],cells[k][1],hz?'r':'d');const m=cells[1];G.enemies.push(mkEnemy(i<nf?'f':'p',m[0],m[1],hz?'r':'d'));break;}}
 const nr=3+Math.min(2,Math.floor((G.round-1)/3));
 for(let i=0;i<nr;i++)for(let tries=0;tries<200;tries++){const c=ri(0,COLS-1),r=ri(3,ROWS-3);
   if(G.dug[r][c]||G.dug[r+1][c]||G.dug[r-1][c]||G.rocks.some(k=>Math.abs(k.c-c)<2&&Math.abs(k.y/T-r)<2))continue;G.rocks.push(mkRock(c,r));break;}
}

/* ---------- PLAYER + PUMP ---------- */
function updPlayer(pp){const p=G.player;p.moving=false;const w=wantDir();
 if(G.harp){updHarp(pp,w);return;}
 if(pp){G.harp={len:0,dir:p.dir,st:'out',tgt:null,t:0};Sfx.shoot();return;}
 if(!w)return;let d=w;const wH=d==='l'||d==='r';
 if(p.x%T!==0&&!wH)d=p.dir;else if(p.y%T!==0&&wH)d=p.dir;
 const[dx,dy]=DIRS[d];
 if(aligned(p)){const c=p.x/T+dx,r=p.y/T+dy;p.dir=d;if(c<0||c>=COLS||r<1||r>=ROWS||rockAt(c,r))return;}
 p.dir=d;stepToward(p,d,p.digging?1.35:1.75);p.moving=true;p.anim++;
 const c0=Math.floor(p.x/T),c1=Math.ceil(p.x/T),r0=Math.floor(p.y/T),r1=Math.ceil(p.y/T);let nw=false;
 for(const[c,r]of[[c0,r0],[c1,r1]])if(!G.dug[r][c]){G.dug[r][c]=true;nw=true;}
 if(c0!==c1)G.hE[r0][c0]=true;if(r0!==r1)G.vE[r0][c0]=true;
 if(p.y>=T)carveRect(p.x+2,p.y+2,T-4,T-4);
 p.digging=nw||(p.digging&&!aligned(p));}
function harpTip(h){const p=G.player,[dx,dy]=DIRS[h.dir];return[p.x+T/2+dx*(T/2+h.len),p.y+T/2+dy*(T/2+h.len)];}
function updHarp(pp,w){const h=G.harp;h.t++;
 if(h.st==='out'){h.len+=7;const[tx,ty]=harpTip(h);
  for(const e of G.enemies){if(!['walk','inflate','charge','fire'].includes(e.st))continue;
   if(Math.abs(e.x+T/2-tx)<T/2&&Math.abs(e.y+T/2-ty)<T/2){h.st='hold';h.tgt=e;h.t=0;e.inf=e.st==='inflate'?e.inf+1:1;e.st='inflate';e.flame=0;e.defT=0;Sfx.pump(e.inf);if(e.inf>=4){popEnemy(e,h.dir);G.harp=null;}return;}}
  const c=Math.floor(tx/T),r=Math.floor(ty/T);if(tx<0||tx>=FW||ty<T||ty>=ROWS*T||!G.dug[r][c]||h.len>=T*2.6)h.st='in';}
 else if(h.st==='in'){h.len-=14;if(h.len<=0)G.harp=null;}
 else{const e=h.tgt;if(e.st!=='inflate'){G.harp=null;return;}
  if(w&&!pp){G.harp=null;return;}
  if(pp||(In.pump&&h.t%16===0)){e.inf++;e.defT=0;Sfx.pump(e.inf);if(e.inf>=4){popEnemy(e,h.dir);G.harp=null;}}}}
function popEnemy(e,hdir){const lay=layerOf(Math.round(e.y/T));let pts=[200,300,400,500][lay];if(e.type==='f'&&(hdir==='l'||hdir==='r'))pts*=2;
 e.st='pop';e.t=0;addScore(pts,e.x,e.y);Sfx.pop();}

/* ---------- ENEMIES ---------- */
function updEnemy(e){const p=G.player,spd=G.espd*(e.flee?1.3:1)*(e.type==='f'?0.92:1);e.t++;
 switch(e.st){
 case 'walk':{
  if(e.flee){fleeMove(e,spd);break;}
  e.ghostCD--;if(e.type==='f')e.fireCD--;
  if(aligned(e)){
   if(e.type==='f'&&e.fireCD<=0){if(Math.abs(p.y-e.y)<T||rand()<0.3){e.st='charge';e.fT=0;if(Math.abs(p.y-e.y)<T)e.face=p.x<e.x?'l':'r';Sfx.charge();break;}e.fireCD=60;}
   if(e.ghostCD<=0&&e.y>T){e.st='ghost';e.gT=0;break;}
   const c=e.x/T,r=e.y/T,opts=['u','d','l','r'].filter(d=>canGo(c,r,d));
   if(!opts.length){e.ghostCD=Math.min(e.ghostCD,40);break;}
   let cand=opts.filter(d=>d!==REV[e.dir]);if(!cand.length)cand=opts;
   if(rand()<0.55){const pc=p.x/T,pr=p.y/T;cand.sort((a,b)=>{const A=DIRS[a],B=DIRS[b];return Math.hypot(c+A[0]-pc,r+A[1]-pr)-Math.hypot(c+B[0]-pc,r+B[1]-pr);});e.dir=cand[0];}
   else if(!cand.includes(e.dir)||rand()<0.3)e.dir=cand[Math.floor(rand()*cand.length)];}
  stepToward(e,e.dir,spd);if(e.dir==='l'||e.dir==='r')e.face=e.dir;break;}
 case 'ghost':{e.gT++;if(e.flee){fleeMove(e,spd);break;}
  const dx=p.x-e.x,dy=p.y-e.y,m=Math.hypot(dx,dy)||1,gs=spd*0.7;e.x+=dx/m*gs;e.y+=dy/m*gs;e.x=Math.max(0,Math.min(FW-T,e.x));e.y=Math.max(T,Math.min(ROWS*T-T,e.y));if(dx)e.face=dx<0?'l':'r';
  if(e.gT>80){const cc=Math.round(e.x/T),rr=Math.round(e.y/T);if(G.dug[rr][cc]&&rr>=1&&!rockAt(cc,rr)&&Math.abs(e.x-cc*T)<=gs+0.5&&Math.abs(e.y-rr*T)<=gs+0.5){e.x=cc*T;e.y=rr*T;e.st='walk';e.ghostCD=ghostCD();}}
  break;}
 case 'charge':e.fT++;if(e.fT>=45){e.st='fire';e.fT=0;Sfx.fire();}break;
 case 'fire':e.fT++;e.flame=Math.min(3*T,e.fT*8);if(e.fT>=45){e.st='walk';e.flame=0;e.fireCD=ri(240,480)/(1+0.08*(G.round-1));}break;
 case 'inflate':if(!G.harp||G.harp.tgt!==e){e.defT++;if(e.defT>=50){e.defT=0;e.inf--;if(e.inf<=0){e.inf=0;e.st='walk';}}}break;
 case 'pop':if(e.t>=24)e.gone=true;break;}}
function fleeMove(e,spd){if(e.y>T+0.01||e.x>0.01&&e.y>T){const tx=0,ty=T,dx=tx-e.x,dy=ty-e.y,m=Math.hypot(dx,dy);if(m<=spd){e.x=tx;e.y=ty;}else{e.x+=dx/m*spd;e.y+=dy/m*spd;}e.st=m<=spd?'walk':'ghost';e.face=dx<0?'l':'r';}
 else{e.st='walk';e.y=T;e.x-=spd;e.face='l';if(e.x<-T){e.gone=true;G.fx.push({x:4,y:T,txt:'ESCAPED',t:0});}}}
function flameRect(e){const x0=e.face==='r'?e.x+T-4:e.x+4-e.flame;return[x0,e.y+8,e.flame,16];}

/* ---------- ROCKS + BONUS ---------- */
const CRUSH=[0,1000,2500,4000,6000,8000,10000,12000,15000];
function updRock(k){const p=G.player;k.t++;
 if(k.st==='still'){const r=Math.round(k.y/T)+1;if(r<ROWS&&G.dug[r][k.c]&&!(Math.abs(p.x-k.c*T)<T&&Math.abs(p.y-r*T)<T&&p.y>k.y)){k.st='wobble';k.t=0;}}
 else if(k.st==='wobble'){if(k.t>=40){k.st='fall';k.t=0;Sfx.rock();}}
 else if(k.st==='fall'){k.y+=4;
  for(const e of G.enemies)if(['walk','ghost','charge','fire','inflate'].includes(e.st)&&Math.abs(e.x-k.x)<T*0.7&&e.y>k.y&&e.y<k.y+T){e.st='crushed';e.flame=0;if(G.harp&&G.harp.tgt===e)G.harp=null;k.crushed.push(e);Sfx.crush();}
  for(const e of k.crushed)e.y=k.y+T*0.55;
  if(Math.abs(p.x-k.x)<T*0.7&&p.y>k.y&&p.y<k.y+T*0.85){killPlayer('rock');}
  if(k.y%T===0){const r=k.y/T+1;if(r>=ROWS||!G.dug[r][k.c]){k.st='crumble';k.t=0;G.rocksFallen++;const n=k.crushed.length;
    if(n){addScore(CRUSH[Math.min(n,8)],k.x,k.y);for(const e of k.crushed)e.gone=true;}
    if(G.rocksFallen>=2&&!G.vegDone){G.vegDone=true;G.veg={x:6*T,y:8*T,t:0,pts:[400,600,800,1000,2000,3000,4000,5000,6000,7000,8000][Math.min(G.round-1,10)]};Sfx.veg();}}}}
 else if(k.st==='crumble'){if(k.t>=36)k.gone=true;}}

function update(){G.frame++;
 if(In.pauseP){In.pauseP=false;if(G.mode==='play')G.mode='pause';else if(G.mode==='pause')G.mode='play';}
 const sp=In.startP;In.startP=false;const pp=In.pumpP;In.pumpP=false;G.modeT++;
 switch(G.mode){

  for(const e of G.enemies)updEnemy(e);for(const k of G.rocks)updRock(k);
  G.enemies=G.enemies.filter(e=>!e.gone);G.rocks=G.rocks.filter(k=>!k.gone);
  const alive=G.enemies.filter(e=>e.st!=='pop'&&e.st!=='crushed');if(alive.length===1&&G.enemies.length===1&&!alive[0].flee)alive[0].flee=true;

  for(const e of G.enemies){if(['walk','ghost','charge','fire'].includes(e.st)&&Math.abs(e.x-p.x)<T*0.65&&Math.abs(e.y-p.y)<T*0.65){killPlayer('enemy');break;}
   if(e.st==='fire'&&e.flame>0){const[fx,fy,fw,fh]=flameRect(e);if(p.x+6<fx+fw&&p.x+T-6>fx&&p.y+6<fy+fh&&p.y+T-6>fy){killPlayer('fire');break;}}}

const BB={manual:false,G,In,step(n){for(let i=0;i<(n||1);i++)update();},render,start:startGame,newLevel,mkEnemy,mkRock,openEdge,
 setup(o){G.round=o.round||1;baseLevel();const p=o.player||[6,8];G.player={x:p[0]*T,y:p[1]*T,sx:p[0]*T,sy:p[1]*T,dir:'r',moving:false,digging:false,anim:0};digTile(p[0],p[1]);
